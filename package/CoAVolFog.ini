; CoAVolFog settings. Changes apply within a second while the game runs,
; except Enable and EngineHooks, which need a client restart.
[CoAVolFog]
Enable=1
EngineHooks=1

; In-game settings window, shown and hidden with OverlayKey. It changes the settings below live; its Save button
; writes the changed ones back to this file and keeps the comments. 0 = off (turning it on again needs a client
; restart; with 0 at start-up the game window is left untouched)
Overlay=1
; F1-F24, Insert, Delete, Home, End, PageUp, PageDown, Pause, ScrollLock, a letter or a digit, with optional Ctrl+,
; Shift+ and Alt+ in front
OverlayKey=Ctrl+F7
; Switches the whole mod off and on while you play, to compare with the plain game: no fog, lights, water, relief or
; lifted view distance. The mod is on at every start; the key is never saved. Works while the game window was hooked
; at start-up (Overlay=1), whether or not the settings window is open
ToggleKey=Ctrl+F12

; 1 = quarter resolution, 16 steps; 2 = half resolution, 24 steps; 3 = half resolution, 32 steps
Quality=3

; Global density multiplier, then the layers used where no Classic data exists: distance haze, low
; ground mist, and the distance fog that replaces the stock fog (FarFog)
Density=0.37
; Density per zone: the zone's id and a multiplier of Density, comma-separated (148:0.5,490:0.7), or none. The
; settings window's "Density" section sets the zone you stand in; a zone change fades over 4 seconds (0-4 each)
ZoneDensity=1:0.09,38:0.33,11:0.1,45:0.11,267:0.21,1537:0.16,2257:0.19,1519:0.15,331:0.21,406:0.24,1337:0.37,3:0.12,36:0.2,4:0.2,46:0.2,41:0.2,10:0.09,139:0.2,12:0.2,3430:0.2,3433:0.2,4080:0.2,44:0.2,51:0.2,3487:0.2,130:0.2,33:0.2,8:0.2,47:0.2,85:0.2,1497:0.2,28:0.2,40:0.2,16:0.2,3524:0.2,3525:0.2,148:0.2,1657:0.2,405:0.2,14:0.2,15:0.2,361:0.2,357:0.2,493:0.2,215:0.2,1637:0.2,1377:0.2,440:0.2,141:0.2,17:0.2,3557:0.2,400:0.2,1638:0.2,490:0.2,618:0.2,3522:0.2,3483:0.2,3518:0.2,3523:0.2,3520:0.2,3703:0.2,3519:0.2,3521:0.2,3537:0.2,2817:0.2,4395:0.2,65:0.2,394:0.2,495:0.2,4742:0.2,210:0.2,3711:0.2,67:0.2,4197:0.2,66:0.2,4298:0.2
; Fog ceiling: while you fly or stand well above the ground, the fog keeps to the lowest yards over the ground, so
; it lies in valleys and among the trees and the air above it is clear; the sunlit air still shows the shafts. In
; yards over the ground, fading over half as much again; it comes in as the camera rises from 1.5 to 3 times that
; height over the ground under it, so nothing changes on foot (0-300, 0 = off)
FogCeiling=40
Haze=1.19
GroundFog=1.86
FarFog=0.71
; With the view distance lifted past the client's cap (FarClipMax): 1 = the distance fog reaches as much further as
; the view does, so land past the zone's fog end is not drawn as a flat fog-coloured shape; 0 = it ends at the zone's
; fog distance in yards (0-1)
FarFogStretch=1.0
; 1 = distant land fades into the zone's own fog colour (the sky at the horizon) and sunlight brightens the distance
; haze and fog only around the sun; 0 = the sun lights them from every side, which turns distant mountains pale.
; The low ground mist keeps its sunlit look either way (0-1)
AerialPerspective=1.0
; Open land: dry zones (the Barrens, Desolace, Tanaris, ...) get a warm dust haze in the air, thickest in the
; afternoon and in wind; green open land (Mulgore, Elwynn, ...) a soft humid haze, thickest in the morning (0-3
; each, 0 = off). Horizon fog: there, far land fades gradually into the colour of the sky at the horizon (0-1, 0 =
; the zone's own distance fog)
DustHaze=1.0
HumidHaze=1.0
HorizonFog=1.0
; Cloud shadows drifting with the wind over dry and green zones, on the ground and in the haze; with a low sun they
; give beams between the clouds (0-1, 1 = a cloud takes the sun's whole share of the light away, 0 = off). Cloud
; cover: 1 = about a quarter of the sky in dry zones and nearly half in green ones, at most 90% (0-2). Cloud size:
; how wide one cloud is, in yards (100-2000)
CloudShadows=0.6
CloudCover=1.0
CloudSize=400
; The zones that count as dry and as green, by the client's zone id, comma-separated, or none. CoAVolFog.log names
; the zone you enter, and the settings window's "Open land" section moves the zone you stand in between the lists
DryZones=14,17,1637,405,400,440,1377,3,51,46,4,40,3483,3522,3520
GreenZones=215,1638,12,44,38,45,267,47,11,1,15,148,490,493,85,130,28,139,36,1519,1657,3430,3433,3487,4080,3524,3525,3521,3519,3518,3703,3537,495,65,394,66,3711,2817,4395,67,210,4197,4742

; 1 = replace the client's linear fog with the volumetric distance fog, 0 = keep the stock fog
StockFog=1

; 1 = use the Classic client's fog layers where its lights cover the map, 0 = derived layers everywhere
DataMode=0
; 1 = scatter and blend in linear light like the modern client, with a soft highlight roll-off; 0 = gamma
ColorSpace=1

; In-scattered sun or moon light (halo and shafts) and ambient fog brightness
SunScatter=1.01
Ambient=0.97
Exposure=1.01
; Brightness of the Classic layers (1 = as authored; the modern client applies no exposure to its fog)
ClassicExposure=1.07
; Colour: the sun's or moon's light in the fog, the shafts and the haze (1 = the client's, 0 = white at the same
; brightness), the whole picture and the sky alone (1 = unchanged, 0 = grey; the picture needs ColorSpace=1)
LightSaturation=1.0
; The sky-lit part of the fog and the haze, the zone's fog colour (1 = the client's, 0 = grey at the same
; brightness, 0-2)
HazeSaturation=1.0
Saturation=1.0
SkySaturation=1.0
; White balance of the whole picture at the same brightness, -1 to 1 (Temperature above 0 warmer, below 0 cooler;
; Tint above 0 toward magenta, below 0 toward green), and of the sky on top of it; 0 = unchanged; needs ColorSpace=1
Temperature=0.0
Tint=0.0
SkyTemperature=0.0
SkyTint=0.0
; White balance of the land against the client's sun and ambient light (0 = the client's colour, 1 = neutral at the
; same brightness, up to 2; not the sky, not indoors; needs ColorSpace=1)
LightBalance=0.0
; Brightness of the land and everything on it, not the sky (1 = the client's, 0.25-2; needs ColorSpace=1)
LandBrightness=1.0
; Brightness of the sky alone in linear light (1 = the client's, 0.25-8; needs ColorSpace=1)
SkyBrightness=1.0
; Share of the clear sky behind a haze in the horizon's colour (0 = the client's sky, 1 = all haze), and the sun's
; disc and halo in that haze (0-4); SkyHazeZenith is the haze's brightness straight overhead against the horizon
; (1 = even, 0.02-1); SkyHazeGlowGrade is how much of the sky's own colour keys the sun's glow takes (1 = all, 0 =
; it keeps the sun's colour)
SkyHaze=0.0
SkyHazeGlow=1.0
SkyHazeZenith=1.0
SkyHazeGlowGrade=1.0
; The haze's sky-lit light in front of the land takes the colour of the sky at the horizon as drawn, so a bright sky
; gives bright distant hills and a dark one dark hills (1 = all the way, 0 = the haze's own colour; the sky and the
; sun's light in the haze are unchanged)
HazeFromSky=1.0
; Its brightness against that sky as displayed (0.85 = a bit darker, 1 = as bright, 0.25-1.5); land seen through the
; haze keeps some of its own light, so snow can still stand out brighter than the sky
HazeSkyLevel=0.85

; Shadowed in-scattering (light shafts through trees, buildings and terrain)
LightShafts=1
; Terrain shadows: mountains and buildings within about 1000 yards keep the sun and moon out of the fog in
; their shadow, whether or not they are on screen (a height map from the game's own collision test)
TerrainShadows=1
; Surface shadows: the same height map darkens the ground, walls and characters in the shadow of mountains and
; buildings, toward the zone's ambient light (1 = the sun's whole share of the light taken away, 0 = off; 0-1).
; Roofed and underground places are left alone
SurfaceShadows=0.63
; Low sun light: while the sun is low (full from sunrise to about 15 degrees up, gone by 30), slopes and walls
; facing it, where the height map says it reaches, get a warm lift in the sun's colour, so the light lands on the
; far mountains at dawn and dusk (1 = 35% brighter facing the sun; 0 = off; 0-2)
LowSunLight=0
; Sun shafts: extra sunlight scattered in the fog and in clear air wherever the sun reaches, traced through trees,
; buildings and terrain whether or not the sun is on screen. 0 = only the fog's own shadowed light
Shafts=0.63
; Stronger shafts while the sun is low, on the same curve as LowSunLight: 1 = twice as strong at dawn and dusk,
; 0 = the same all day (0-3)
LowSunShafts=0
; How bright the shafts' light grows before it grows only as its square root: keeps the glow around a low sun
; small, while beams through trees and gaps, which are dimmer, keep their strength (0.02-4, 4 = almost none)
ShaftGlare=0.03
; 0 = shafts as bright seen from any side; higher = brighter looking toward the sun, fainter looking away (0-0.95)
ShaftFocus=0.71
; The same beams from the moon at night (from moonrise after sunset, at the latest 22:10, to 04:50). Moonlight
; is dim and the moon stands high, so they need more strength and a lower focus than the sun's (0-8, 0-0.95)
MoonShafts=2.64
MoonShaftFocus=0.51
; Clear air lit by the shafts, so they show where the zone's fog is thin (0 = the fog only)
ShaftHaze=1.23
; How far from the camera shafts are traced, in yards (30-600)
ShaftRange=235
; How far toward the sun each point looks for trees and buildings that shade it, in yards (10-300)
ShaftLength=300
; How deep trees and buildings are taken to be behind their visible face, per yard of their distance (0.1-4);
; used only with ShaftMemory=0
ShaftDepth=1.92
; 1 = trees and buildings shade the shafts from a map of everything seen so far, fixed in the world (about 640 yd
; around the camera), so turning the camera does not change the shafts; 0 = only what is on screen, with a guess
; past the screen's edges
ShaftMemory=1
; Drifting fog: how patchy the fog is (0-2). The patches drift with the wind, and the shafts brighten where the
; fog is thick and fade where it is thin. 0 = even fog, as before. Distant fog stays even.
Drift=0.6
; Size of the drifting patches in yards (10-300)
DriftSize=60
; Share of fine, wispy smoke in the drift (0-1), a tenth of the patch size and smaller. 0 = only the large patches
DriftDetail=0.65
; How far the large patches twist and stretch the smoke (0-3). 0 = straight wisps
DriftSwirl=1
; Fog banks: 0 = even layers at your own height, as before; 1 = the fog gathers everywhere and at every hour into
; separate banks, as big as the drifting patches, that lie on the ground under them, fill valleys and leave clear
; air between them; 2 = the same only in valleys and over lakes at dawn and dusk, even layers otherwise
Banks=1
; Share of the ground under a bank (0-1); the banks are denser where they are fewer, so the fog keeps its amount.
; 1 = one even blanket that follows the ground
BankCover=0.55
; How high the banks reach above the ground under them, in yards (5-300)
BankHeight=60
; How much the fog gathers in valleys and over lakes and leaves ridges and hilltops clear (0-3)
BankPool=1
; How much a bank shades its own inside from the sun or moon, so it has a lit side and a dark one (0-3)
BankShadow=1
; Drift speed in yards per second in clear weather (0-10), and in full rain, snow or sandstorm (0-20); weaker
; weather lies in between
WindSpeed=2
StormWind=7
; Where the wind blows to, in degrees: 0 north, 90 east, 180 south, 270 west
WindDirection=60
; Morning mist in low ground: extra fog near and below your ground level at dawn (full 05:00 to 07:30, gone by
; 10:00). 2 = three times the fog near the ground (0-8); a zone with little fog of its own near the ground gets
; up to eight times more, so the mist shows there too. MistHeight is how far above your ground level it reaches,
; in yards (2-60)
MorningMist=2.0
MistHeight=12
; Evening haze: extra fog everywhere in the evening (full 20:00 to 22:00, gone by midnight). 0.4 = 40% more (0-2)
EveningHaze=0.4
; Weather: extra fog in full rain, snow or sandstorm (1 = twice the fog, 0-4), the share of the shafts left as
; clouds hide the sun (0-1), how far the fog turns grey in rain, white in snow and sandy in a sandstorm (0-1), and
; how far the sky and its clouds turn the colour of that fog, an overcast sky (0-1, 1 = 85% in full weather)
WeatherFog=0.25
WeatherShafts=0.35
WeatherTint=1.0
WeatherSky=1.0
; Rain, snow and sand drawn by the client stay in front of the fog and the overcast sky (1 = fogged as if 25 yd away,
; 0 = as if as far as what is behind them, 0-1)
RainInFront=1.0
; Blue tint of the fog around sunset and sunrise, while the sun is just below the horizon (0-2)
Twilight=1.0
; The moons the HD skyboxes paint on their sky (Arathi, Feralas, Kalimdor's tundra skies and more): 0 = left out,
; so only the game's own moon shows, the one the moonlight, the moon shafts and the glitter on the water come from;
; 1 = drawn as well
SkyboxMoons=0
; The game's own sun and moon drawn over the sky last, so an HD skybox or the sky haze cannot hide them; land in
; front still does (1 = as the client draws them, dimmer in thick fog and rain; 0 = left to the client; needs
; ColorSpace=1)
SunAndMoon=1.0
; Lamps, windows and fires glow into the fog at night; the thicker the fog, the larger the halo (0-8, 0 = off).
; GlowThreshold is how bright a pixel must be to glow (0.2-0.95; lower = more things glow)
LightGlow=0
GlowThreshold=0.4
; Lamp halos: torches, candles, braziers, campfires, lanterns and street lamps placed in the world glow in the
; air, from the lamp list lampdata.bin next to the DLL (tools/lamp_extract). By day the LampDayLight share, more in
; rain, snow or sand and in thicker fog or morning mist, none in the ghost world (0-4, 0 = off). LampCount is how many
; of the lamps in view are used, those giving the most light at the camera first (0-128), LampFlicker how much flames
; flicker (0-2, 0 = steady; lanterns behind glass never flicker), FireStrength the strength of open fires (braziers,
; bonfires, campfires, hearths), their light and halos, against the other lamps (0-2, 1 = the same), LampIndoors the
; strength of lamps inside rooms, and of every lamp while the player stands indoors, their light and halos (0-2, 1 = as
; outdoors). FarLights: at night the outdoor lamps from 60 yd out also show as small points of light, even where
; their halos are too faint to see, so a town across a valley isn't dark (0-4, 0 = off)
LampFog=0.17
LampCount=110
LampFlicker=1.0
FireStrength=0.5625
LampIndoors=0.49
FarLights=1.0
; Lamp light: the same lamps light the ground, walls, plants and characters around them in their own colour, falling
; off like the game's own point lights, by night and by day, not in the ghost world (0-4, 0 = off). LampDayLight: the
; share of their light and halos by day, when the sun outshines them (0-1, 0 = none by day, 1 = as at night).
; LampShadows: things
; on screen between a lamp and a surface block its light (0-1, 0 = no lamp shadows)
LampLight=4
LampDayLight=0.11
LampShadows=0.96
; Carried light shadows: how much of LampShadows the lights that move with things keep: spells, projectiles,
; enchants, the loot sparkle and the belt lantern (0-1, 0 = they cast no shadows, so no character's shadow swings
; around with them; placed lamps keep theirs)
CarriedShadows=0.0
; Window light: lit windows cast their light onto the street, walls and characters in front of them (up to 8 windows
; in view, from lampdata.bin), at night only and not in the ghost world (0-4, 0 = off)
WindowLight=2.63
; Spell light: glowing spells, projectiles, enchants and other bright effects the client draws over the world light the
; ground, walls and characters around them in their own colour, up to 6 at a time, with lamp shadows. Only what is on
; screen counts; the flames of the lamps in lampdata.bin are left to the lamps. In rain or snow only coloured glows
; count. By day the LampDayLight share, not in the ghost world (0-4, 0 = off)
EffectLight=1.68
; Loot sparkle: corpses you can loot give a small golden twinkle of light (the nearest 4 within 40 yd), taken from
; the client's list of objects, not from the screen. They share the spell light's 6 places, spells first. By day the
; LampDayLight share, not in the ghost world (0-2, 0 = off)
CorpseLight=1.0
; Night darkness: darkens the moonlit scene at night outdoors, but not flames, lit windows, lit rooms or what the
; lamps light, and not while the player is indoors (0-0.9 of the light taken away, 0 = the game's own night)
NightDarkness=0.75
; Belt lantern: a lantern at the player's belt lights the ground, walls, plants and characters around them, and what
; stands in its light casts shadows (LampShadows). 0 = off; 1 = in the dark: it lights by itself at night and indoors
; (caves, dungeons, buildings) and goes out by day; 2 = always. Never while swimming or as a ghost. Needs the
; client's player position (see CoAVolFog.log). LanternKey switches it on or off and saves Lantern here (the key
; needs Overlay=1)
Lantern=0
; Lantern light: how brightly it lights things around the player, in the colour of the game's torches and fires
; (0-4, 0 = no lantern). Lantern halo: how strongly it glows in the fog around it, times LampFog (0-2, 0 = no
; glow). Lantern swing: how much it swings on its hook when the player walks, runs, turns and stops (0-2, 0 = it
; hangs still)
LanternLight=2.96
LanternHalo=0.3
LanternSwing=0.37
LanternKey=Ctrl+F6
; Spot key: saves the place, camera, game time, weather and these settings as a numbered spot in
; CoAVolFog-spots.txt next to this file, with a copy of the settings in CoAVolFog-spots\spot-NNN.ini, and shows
; "Spot N saved" for 3 s (the key needs Overlay=1)
SpotKey=Ctrl+F5
; Radial god rays from the bright sky around the sun, 0 = off (the client's glow already brightens the sun)
GodRays=0
; 1 = pre-compensate the fog for the client's full-screen glow (ffxGlow), which otherwise bleaches bright
; fog around the sun to white; 0 = off
GlowCompensation=1

; View distance in yards on the continents (Eastern Kingdoms, Kalimdor, Outland, Northrend), which the client
; caps at 791. Up to 1583 (the engine's limit, used in instances), within the client's own farclip setting.
; 0 = leave the client's cap. Turning it on when it was 0 at start-up needs a client restart; other changes,
; including 0, apply at the next farclip change, map load or zone change (e.g. "/console farclip 1583"), and
; raising it shows a loading screen at that moment. Costs about four times the loaded terrain.
FarClipMax=1583.33

; Fog range in yards: how far sky rays are integrated and the scale of the Classic distance curves
MaxDistance=5000
; History weight of the temporal filter, 0 = off
Temporal=0.63
; Keep the effect while the camera is under water
Underwater=0
; Let water surfaces write depth so water is fogged by its own distance
LiquidDepth=1

; Water (needs LiquidDepth=1; lava and slime stay as the game draws them).
; Reflections of the sky, shores, trees and buildings on screen: strong when you look across the water,
; weak when you look down into it. 0-2, 0 = off
WaterReflect=1.04
; Sparkling path of the sun, and of the moon at night, on the waves (less under clouds), and the glints of
; lamps and lit windows on the water; none in the ghost world. 0-4, 0 = off
WaterGlitter=1.99
; See the bottom through shallow water, and a deeper teal where the water gets deep. 0-1, 0 = the game's
; own water colour
WaterClarity=0.5
; The game's animated water texture under the reflections replaced by the zone's own water colours, shallow to deep
; (from the game's light settings for the hour, rivers and lakes apart from the sea), as the high-quality water of
; later clients: one smooth surface that the waves and the reflections play on. 0-1, 0 = the game's texture as drawn
WaterSmooth=0
; Fine ripples from the later clients' water normal map drift with the wind over the waves and bend the reflections;
; foam gathers where the water is shallow along the shores. Both need the textures Lumenveil-Setup.cmd copies into
; the Lumenveil folder from the game's archives (waterbump.blp, waterfoam.blp) when a patch holds them. 0-2, 0 = off
WaterBump=0
WaterFoam=0
; Small waves that break up the reflections and the glitter, higher in rain, snow or sand, and the ripples
; around your feet while you wade or swim. 0-2, 0 = a still mirror
WaterWaves=0.25
; How strongly raindrops ring out on the water while it rains; how many follows the rain. None in snow or sand.
; Far away the rings roughen the water instead. 0-2, 0 = off
WaterRain=1
; Reflections of what left the screen come from a panorama of everything seen from here, so turning the
; camera does not make them pop or vanish. 0 = only what is on screen
WaterMemory=1

; Wet and shiny surfaces (only with ColorSpace=1; none in the ghost world or indoors).
; Stone, cobbles, rock, ice and other smooth surfaces catch the sun, the moon and the lamps when you look along them
; toward the light, most of all under a low sun; snow sparkles; grass, dirt and sand stay matt. 0-2, 0 = off
SurfaceSheen=1
; Rain wets what stands under the open sky within about a minute, each ground as its material takes water: stone
; gets a glossy film at once, soil and sand darken first and gloss only once soaked, grass beads into droplets that
; glint but never mirror, snow does not darken. Wet surfaces reflect the sky, what is on screen and the lamps. It
; dries over minutes once the rain stops, slower at night. Nothing under roofs. 0-2, 0 = surfaces never get wet
WetSurfaces=0
; How much of the flat open ground pools into puddles in steady rain: still mirrors of the sky, the land and the
; lamps that fill over a minute or two and outlast the wet ground. Water stands on stone, soil and ice, hardly on
; sand, never on grass or snow. 0-2, 0 = no puddles
Puddles=0
; Tell what a surface is made of from its texture, so rain wets each the way it should (only with the game's shadows
; at extShadowQuality 3 or more): the ground from materialdata.bin next to this file (grass, soil, stone, sand, snow,
; ice, wood or lava), buildings and models from their relief type (stone, wood, metal, fabric, ...; models need
; ReliefModels=1). 0 = judge every surface by its colour
TerrainMaterials=1
; Ground relief: cobbles, rocks, roads and dirt on the terrain get depth from a height map per texture
; (reliefdata.bin next to this file): stones stand up, hide what lies behind them, catch the sun on one side and
; cast small shadows. Only with the game's shadows at extShadowQuality 3 or more. ReliefKey switches it on or off
; and saves Relief here (the key needs Overlay=1)
Relief=1
; Relief on models: trees, creatures, characters, armour and props get relief too. Their height maps are made
; while the game runs, on a thread of their own, the first time each texture is drawn (0 = buildings and ground only)
ReliefModels=0
; Relief depth: how deep the deepest cracks are, in yards, for cobbles and rocks; every other type of texture gets
; its own share of it below (0-0.75, 0 = flat)
ReliefDepth=0.138
; Relief light: how much the relief's own slopes brighten and darken in the sun (0-2, 0 = the ground's own light).
; Relief shadows: how dark the small shadows inside the relief are (0-1, 0 = none)
ReliefLight=1.01
ReliefShadows=1.0
; Relief distance: how far from the camera the ground keeps its relief, in yards; it fades out over the last
; quarter of it (5-1500)
ReliefDistance=161
; Relief by texture type: each type's share of the relief depth (0-3; 0 = flat, 1 = the full depth). A texture that
; is smooth in itself, such as plain snow or a solid colour, gets less whatever its type. The ground, buildings and,
; with ReliefModels=1, models have relief
; Roads, paving, cobbles and paved floors, outdoors and in buildings
ReliefRoads=0.4
; Rock, cliffs, gravel, boulders and caves
ReliefRock=0.4
; Dirt, mud, soil, ash, and ground of no other type
ReliefDirt=1.1
; Sand, dunes and beaches
ReliefSand=0.2
; Snow and ice
ReliefSnow=0.2
; Grass, moss, fallen leaves and crops on the ground
ReliefGrass=0.4
; Walls of stone, brick and plaster, trim, pillars, ceilings and window frames
ReliefWalls=0.7
; Roofs: shingles, tiles and thatch
ReliefRoofs=0.7
; Planks, beams, wooden walls and floors, fences, crates and barrels
ReliefWood=0.5
; Metal and iron, chains, pipes and machines
ReliefMetal=0.3
; Tree trunks, branches, roots and logs
ReliefBark=0.6
; Leaves, bushes, plants and flowers on models
ReliefLeaves=0.2
; Creatures: fur, hide and scales
ReliefCreatures=0.15
; Characters and the armour they wear on their body
ReliefCharacters=0.1
; Helmets, shoulders, weapons and shields
ReliefArmour=0.1
; Props: cloth, banners, lamps, signs and everything else
ReliefProps=0.4
ReliefKey=Ctrl+F4
; Region key: opens the region panel, where the settings above can be set per zone, time of day and weather
; (saved in CoAVolFog-regions.ini next to this file, never here), with the time of day and the weather as only
; you see them, and a checklist of zones (the key needs Overlay=1)
RegionKey=Ctrl+F3

; 0 = off, 1 = fog radiance only, 2 = transmittance, 3 = linear depth, 4 = surface shadows, 5 = lamp halos,
; 6 = lamp light, 7 = the client's own shadow maps seen through its receivers' matrices, 8 = the same through
; its casters' matrices (7 and 8 draw no fog; see the README)
DebugView=0
; Red marker where the sun direction projects on screen
SunMarker=0
; 0 = errors, 1 = info, 2 = debug
LogLevel=1

; Draw log for research: 1 = DrawLogKey captures the next frame that draws the world to CoAVolFog-draws.csv next to
; the log (the key needs Overlay=1); 2 = the same once each time this file is read with DrawLog=2; 0 = off
DrawLog=0
DrawLogKey=Ctrl+Shift+F10
; Shader constants whose values the draw log writes to CoAVolFog-draws\constants.csv, as registers like
; c2-5,c37-48 (none = no values). Empty = vertex c0-7,c14-16,c31-33,c37-48,c224-235 and pixel c0-12, which cover
; the client's shadow-map matrices
DrawLogVertexConstants=
DrawLogPixelConstants=
; Frame profile: 1 = the main thread's and the GPU's time for each part of the fog, the client and Present, in the
; log every 60 s; 0 = off
PerfLog=0
; Research: 1 = find the client's own sun shadow maps each frame and describe them in the log once a minute;
; DebugView 7 and 8 turn this on by themselves; 0 = off
ClientShadowMaps=0
