name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Build, test without a GPU, pack
        shell: powershell
        run: .\scripts\Build-Release.ps1 -CpuTestsOnly

      - name: Comment check
        shell: pwsh
        run: python engine/tools/check_comments.py

      - uses: actions/upload-artifact@v4
        with:
          name: Lumenveil
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
